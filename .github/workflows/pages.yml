name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - trunk
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Override NEXT_PUBLIC_API_BASE (full URL with scheme)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint + typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '/match57' }}
          NEXT_PUBLIC_API_BASE: ${{ inputs.api_base || vars.NEXT_PUBLIC_API_BASE }}
        run: |
          echo "Building with:"
          echo "  STATIC_EXPORT=$STATIC_EXPORT"
          echo "  NEXT_PUBLIC_BASE_PATH=$NEXT_PUBLIC_BASE_PATH"
          echo "  NEXT_PUBLIC_API_BASE=$NEXT_PUBLIC_API_BASE"
          npm run build

      - name: SPA fallback (404.html copy)
        run: |
          # GitHub Pages serves /404.html when a path is unknown; we duplicate
          # index.html as a soft fallback so client-side routing keeps working
          # after a hard refresh on a non-prerendered URL.
          if [ -f out/404.html ]; then
            echo "out/404.html already exists, leaving alone"
          else
            cp out/index.html out/404.html
          fi
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
